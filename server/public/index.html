<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spalla</title>
<!--
  SPALLA — dashboard v2 ("Spalla × Raycast")
  ─────────────────────────────────────────────────────────────────────
  Arquivo único, sem dependências. Tudo que é dado vem de `state`.
  Pontos de integração estão marcados com  >>> INTEGRAÇÃO  <<<.

  Regras do design system (não quebrar):
  • Âmbar (--attn) só em needs_approval e waiting_input. Nada mais.
  • Sem glow, sem halo, sem gradiente, sem glassmorphism na versão web.
  • Atenção = posição (seção "Precisa de você" no topo) + filete de 2px.
  • Mono só pra dado (tempo, task, PID, caminho). UI em Plex Sans.
  • Todo comando tem atalho visível ao lado dele.
  • O Spalla só avisa, nunca aprova: nenhuma ação de aprovar existe aqui.
  • Vazio sempre explica o motivo.
  • Texto de log e markdown de agente entram via textContent (nunca innerHTML).
  • "Resumo do Maestro": o agente gerenciador (Atlas) escreve .md, o Spalla
    renderiza. O progresso sai dos checkboxes (- [ ] / - [x]) do próprio .md.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Tokens ─────────────────────────────────────────────────────────── */
:root {
  --font-sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --r-key: 4px; --r-row: 6px; --r-block: 8px;
  --attn-fill: #FFBF47;           /* marca: ponto da fermata, filete */
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0A0A0B; --panel: #111113; --elev: #18181B; --key: #222226;
  --text: #F4F4F5; --text-2: #B4B4BB; --text-3: #8A8A93; --text-4: #5C5C66;
  --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12); --sel: rgba(255,255,255,.06);
  --key-shadow: inset 0 1px 0 rgba(255,255,255,.06);
  --overlay-shadow: 0 16px 40px rgba(0,0,0,.5);
  --attn: #FFBF47; --run: #5EB1FF; --ok: #4FD18B; --fail: #FF6B6B; --idle: #B4B4BB;
  --p-exec: #5EB1FF; --p-utd: #2F5A80; --p-skip: #3A3A40; --p-rest: #1C1C20;
  --run-bg: rgba(94,177,255,.08); --fail-bg: rgba(255,107,107,.08); --fail-text: #FFB4B4;
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #F6F6F7; --panel: #FFFFFF; --elev: #FFFFFF; --key: #FFFFFF;
  --text: #18181B; --text-2: #4B4B55; --text-3: #5F5F69; --text-4: #71717A;
  --line: rgba(0,0,0,.08); --line-2: rgba(0,0,0,.14); --sel: rgba(0,0,0,.05);
  --key-shadow: 0 1px 0 rgba(0,0,0,.08);
  --overlay-shadow: 0 16px 40px rgba(0,0,0,.14);
  --attn: #A86A00; --run: #1F6FD1; --ok: #1E8A50; --fail: #C93636; --idle: #4B4B55;
  --p-exec: #2F7FE0; --p-utd: #A9C8EF; --p-skip: #D4D4D8; --p-rest: #EDEDF0;
  --run-bg: rgba(31,111,209,.07); --fail-bg: rgba(201,54,54,.07); --fail-text: #9B1C1C;
}

/* ── Base ───────────────────────────────────────────────────────────── */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 400 14px/1.45 var(--font-sans); letter-spacing: .005em; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--run); outline-offset: 1px; }
.mono { font-family: var(--font-mono); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── Layout ─────────────────────────────────────────────────────────── */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.body { flex: 1; display: flex; flex-wrap: wrap; min-height: 0; }

/* ── Topbar ─────────────────────────────────────────────────────────── */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.brand b { font-weight: 600; }
.brand .sep { color: var(--text-4); }
.brand .project { color: var(--text-2); }
.search { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px 0 12px; border-radius: var(--r-block); background: var(--panel); border: 1px solid var(--line-2); flex: 1 1 320px; max-width: 560px; }
.search svg { color: var(--text-3); flex-shrink: 0; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px; }
.search input::placeholder { color: var(--text-3); }
.topbar-right { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; font-size: 13px; color: var(--text-3); }
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.conn { display: flex; align-items: center; gap: 6px; }
.link-btn { border: 0; background: none; padding: 0; text-decoration: underline; cursor: pointer; color: var(--text-2); }
.icon-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-row); border: 1px solid var(--line-2); background: var(--panel); color: var(--text-2); cursor: pointer; }

/* ── Teclas ─────────────────────────────────────────────────────────── */
kbd { min-width: 22px; height: 22px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-key); background: var(--key); border: 1px solid var(--line-2); box-shadow: var(--key-shadow); font: 500 12px var(--font-mono); color: var(--text-2); }
.keys { display: inline-flex; gap: 4px; }

/* ── Lista ──────────────────────────────────────────────────────────── */
.list { flex: 1 1 340px; max-width: 100%; min-width: 0; padding: 8px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.list-header { padding: 12px 10px 4px; font-size: 12px; font-weight: 500; color: var(--text-3); }
.row { position: relative; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border: 0; border-radius: var(--r-row); background: transparent; text-align: left; cursor: pointer; width: 100%; }
.row:hover { background: var(--sel); }
.row[aria-selected="true"] { background: var(--sel); }
.row .stripe { position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: var(--attn-fill); }
.row .glyph { width: 16px; display: flex; justify-content: center; flex-shrink: 0; }
.row .name { font-size: 14px; font-weight: 500; white-space: nowrap; }
.row .sub { font-size: 13px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.row .acc { font: 12px var(--font-mono); color: var(--text-3); white-space: nowrap; }
.row.attn .acc { color: var(--attn); }
.row.muted { opacity: .55; }
.list-empty { padding: 24px 10px; color: var(--text-3); font-size: 13px; }

/* ── Detalhe ────────────────────────────────────────────────────────── */
.detail { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding: 24px 28px; }
.title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
.title-row h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.title-row .clock { margin-left: auto; font: 28px var(--font-mono); }
.prose { margin: 0; font-size: 15px; line-height: 1.55; color: var(--text-2); max-width: 640px; }
.prose code { font-family: var(--font-mono); color: var(--text); }
.task-label { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; color: var(--text-3); }
.task-name { font: 15px var(--font-mono); }
.progress { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; }
.metrics { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; border-radius: var(--r-block); overflow: hidden; border: 1px solid var(--line); background: var(--line); }
.metrics > div { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; background: var(--bg); }
.metrics dt { font-size: 12px; color: var(--text-3); }
.metrics dd { margin: 0; font: 14px var(--font-mono); }
.events { display: flex; flex-direction: column; border-radius: var(--r-block); border: 1px solid var(--line); }
.events > div { display: flex; gap: 14px; padding: 10px 14px; font-size: 13px; border-top: 1px solid var(--line); }
.events > div:first-child { border-top: 0; }
.events .when { font-family: var(--font-mono); color: var(--text-3); }
.empty { display: flex; flex-direction: column; gap: 12px; padding: 48px 0; max-width: 520px; }
.empty h1 { margin: 0; font-size: 22px; font-weight: 600; }
.empty .hint { display: flex; align-items: center; gap: 8px; padding-top: 8px; font-size: 13px; color: var(--text-2); }

/* ── Log ────────────────────────────────────────────────────────────── */
.log { display: flex; flex-direction: column; border-radius: var(--r-block); border: 1px solid var(--line); background: var(--panel); min-height: 0; }
.log-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--text-2); }
.log-toolbar .file { font: 12px var(--font-mono); color: var(--text-3); }
.log-toolbar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.log-toolbar .spacer { margin-left: auto; }
.log-body { padding: 8px 0; font: 12px/1.85 var(--font-mono); overflow: auto; max-height: 52vh; }
.ll { display: flex; gap: 14px; padding: 0 14px; white-space: pre; color: var(--text-2); }
.ll .t { width: 56px; flex-shrink: 0; color: var(--text-4); }
.ll .t:empty { display: none; }  /* logs do Gradle não têm horário; só mostra se o server mandar `t` */
.ll.task { color: var(--text); }
.ll.current { background: var(--run-bg); color: var(--text); }
.ll.error { background: var(--fail-bg); color: var(--fail-text); }
.ll.error .t { color: var(--fail); }
.ll.group { color: var(--text-3); cursor: pointer; border: 0; background: none; width: 100%; text-align: left; font: inherit; }
.ll.group:hover { color: var(--text-2); }
.ll mark { background: var(--attn-fill); color: #18181B; border-radius: 2px; }

/* ── Rodapé / barra de ações ───────────────────────────────────────── */
.footer { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-height: 44px; padding: 6px 12px 6px 20px; border-top: 1px solid var(--line); background: var(--panel); }
.footer .state { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); flex: 1; min-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.footer .act { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 6px; border-radius: var(--r-row); cursor: pointer; font-size: 13px; }
.footer .act:hover { background: var(--sel); }
.footer .act.secondary { color: var(--text-2); }
.footer .divider { width: 1px; height: 16px; background: var(--line-2); }

/* ── Painel de ações (Ctrl/⌘ K) ────────────────────────────────────── */
.ap-backdrop { position: fixed; inset: 0; z-index: 10; }
.ap { position: fixed; right: 16px; bottom: 56px; z-index: 11; width: min(380px, calc(100vw - 32px)); display: flex; flex-direction: column; border-radius: 12px; background: var(--elev); border: 1px solid var(--line-2); box-shadow: var(--overlay-shadow); overflow: hidden; }
.ap-title { padding: 10px 14px; font-size: 12px; color: var(--text-3); border-bottom: 1px solid var(--line); }
.ap-list { display: flex; flex-direction: column; gap: 2px; padding: 6px; max-height: 50vh; overflow: auto; }
.ap-item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: var(--r-row); background: transparent; cursor: pointer; text-align: left; width: 100%; font-size: 14px; }
.ap-item[aria-selected="true"] { background: var(--sel); }
.ap-item .label { flex: 1; }
.ap-sep { height: 1px; margin: 4px 8px; background: var(--line); }
.ap-filter { display: flex; padding: 10px 14px; border-top: 1px solid var(--line); }
.ap-filter input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 14px; }

/* ── Resumo do Maestro (markdown do agente gerenciador) ────────────── */
.report-head { display: flex; flex-direction: column; gap: 12px; }
.report-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 13px; color: var(--text-3); }
.report-meta .file { font: 12px var(--font-mono); }
.pager { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; }
.pager button { height: 28px; min-width: 28px; padding: 0 8px; border-radius: var(--r-row); border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; font-size: 13px; color: var(--text-2); }
.pager button:disabled { opacity: .4; cursor: default; }
.pager span { font: 12px var(--font-mono); color: var(--text-3); padding: 0 6px; }
.report-progress { display: flex; flex-direction: column; gap: 8px; }
.report-progress .row-text { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; color: var(--text-2); }
.report-progress .bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; background: transparent; }
.stale { font-size: 13px; color: var(--text-2); }
.segmented { align-self: flex-start; display: inline-flex; height: 32px; padding: 2px; border-radius: var(--r-row); background: var(--panel); border: 1px solid var(--line); }
.segmented button { border: 0; border-radius: var(--r-key); background: transparent; padding: 0 12px; font-size: 13px; color: var(--text-3); cursor: pointer; }
.segmented button[aria-pressed="true"] { background: var(--sel); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
.md-source { margin: 0; padding: 14px 16px; border-radius: var(--r-block); border: 1px solid var(--line); background: var(--panel); font: 12.5px/1.7 var(--font-mono); color: var(--text-2); white-space: pre-wrap; word-break: break-word; max-width: 820px; }

.md { max-width: 760px; font-size: 15px; line-height: 1.65; color: var(--text); }
.md > :first-child { margin-top: 0; }
.md h2 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; margin: 32px 0 10px; }
.md h3 { font-size: 17px; font-weight: 600; margin: 28px 0 8px; }
.md h4, .md h5 { font-size: 15px; font-weight: 600; margin: 20px 0 6px; }
.md p { margin: 0 0 12px; }
.md strong { font-weight: 600; }
.md a { color: var(--run); text-underline-offset: 2px; }
.md ul, .md ol { margin: 0 0 14px; padding-left: 22px; }
.md li { margin: 4px 0; }
.md li > ul, .md li > ol { margin: 4px 0 0; }
.md li.task { list-style: none; margin-left: -22px; display: flex; gap: 10px; align-items: baseline; }
.md li.task input { margin: 0; transform: translateY(2px); accent-color: var(--ok); }
.md li.task.done > span { color: var(--text-3); }
.md code { font: .88em var(--font-mono); padding: 1px 5px; border-radius: var(--r-key); background: var(--sel); border: 1px solid var(--line); }
.md pre { margin: 0 0 14px; padding: 12px 14px; border-radius: var(--r-block); background: var(--panel); border: 1px solid var(--line); overflow: auto; }
.md pre code { padding: 0; border: 0; background: none; font-size: 12.5px; line-height: 1.7; }
.md blockquote { margin: 0 0 14px; padding: 2px 0 2px 14px; border-left: 2px solid var(--line-2); color: var(--text-2); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
.md table { width: 100%; border-collapse: collapse; margin: 0 0 16px; font-size: 14px; }
.md th { text-align: left; font-size: 12px; font-weight: 500; color: var(--text-3); padding: 0 12px 8px 0; }
.md td { padding: 9px 12px 9px 0; border-top: 1px solid var(--line); vertical-align: top; }

/* ── Toast (vive na barra, como no Raycast) ─────────────────────────── */
.footer .toast { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }

@media (max-width: 720px) {
  .list { border-right: 0; border-bottom: 1px solid var(--line); }
  .detail { padding: 20px 16px; }
  .title-row .clock { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .row, .ap-item, .footer .act { transition: background-color .12s ease; }
}

/* ── Painéis com rolagem própria ─────────────────────────────────────── */
@media (min-width: 900px) {
  .app { height: 100vh; min-height: 0; }
  .body { flex-wrap: nowrap; overflow: hidden; }
  .list, .detail { overflow-y: auto; min-height: 0; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg width="20" height="15" viewBox="0 0 24 18" role="img" aria-label="Spalla"><path d="M3 15 C3 5, 21 5, 21 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="13.5" r="2.4" fill="var(--attn-fill)"/></svg>
      <b>Spalla</b><span class="sep">/</span><span class="project" id="project-name"></span>
    </div>
    <label class="search" for="search">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5 L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="sr-only">Buscar</span>
      <input id="search" type="search" placeholder="Buscar agentes, builds, tasks, logs" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="topbar-right">
      <span class="conn" id="conn"></span>
      <span id="notif"></span>
      <button class="icon-btn" id="theme-btn" type="button"></button>
    </div>
  </header>

  <div class="body">
    <nav class="list" id="list" aria-label="Agentes, builds e dispositivo" role="listbox"></nav>
    <main class="detail" id="detail" aria-live="polite"></main>
  </div>

  <footer class="footer" id="footer"></footer>
</div>

<div id="ap-root"></div>

<script>
(() => {
'use strict';

/* ═══════════════════════════════════════════════════════════════════
   Plataforma: no Windows o modificador é Ctrl, no Mac é ⌘.
   ═══════════════════════════════════════════════════════════════════ */
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const MOD = IS_MAC ? '⌘' : 'Ctrl';

/* ═══════════════════════════════════════════════════════════════════
   ESTADO
   Estado inicial: GET /api/state. Mudanças: SSE em /stream (ver final do arquivo).
   ═══════════════════════════════════════════════════════════════════ */
const MIN = 60 * 1000;

const EMPTY = {
  config: { name: '', package: '', stuckAfterMinutes: 10 },
  connection: 'reconnecting',           // 'connected' | 'reconnecting' | 'offline'
  agents: [],
  build: { id: 'current', variant: 'debug', status: 'idle', startedAt: Date.now(), endedAt: null, task: '',
    counts: { executed: 0, upToDate: 0, fromCache: 0, skipped: 0 }, totalKnown: false, total: 0, log: null, lines: [] },
  history: [],
  device: { adb: false, serial: null, booted: false, installed: false, running: false, wrapperPhase: 'idle' },
  metro: { running: false, port: 8081, lines: [] },
  logcat: { lines: [] },
  reports: []                           // resumos do agente gerenciador, mais novo primeiro
};

const ui = {
  selected: 'report',
  reportIndex: 0,                 // 0 = mais recente
  reportView: 'rendered',         // 'rendered' | 'source'
  theme: readPref('spalla.theme') || 'dark',
  query: '',
  onlyErrors: false,
  groupNoise: true,
  expandedGroups: new Set(),
  muted: new Set(readPref('spalla.muted', true) || []),
  actionPanel: null,              // { items, index, filter }
  toast: null                     // { kind, text, until }
};

let state = EMPTY;

/* ═══════════════════════════════════════════════════════════════════
   Utilitários
   ═══════════════════════════════════════════════════════════════════ */
function readPref(key, json) {
  try { const v = localStorage.getItem(key); return json ? JSON.parse(v) : v; } catch { return null; }
}
function writePref(key, value) {
  try { localStorage.setItem(key, typeof value === 'string' ? value : JSON.stringify(value)); } catch {}
}
/** h('div.cls', {attrs}, ...children) — cria DOM sem innerHTML. */
function h(tag, attrs, ...kids) {
  const [name, ...classes] = tag.split('.');
  const el = document.createElement(name || 'div');
  if (classes.length) el.className = classes.join(' ');
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'style') el.style.cssText = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const SVG_NS = 'http://www.w3.org/2000/svg';
function svg(markup, size = 13) {
  const el = document.createElementNS(SVG_NS, 'svg');
  el.setAttribute('width', size); el.setAttribute('height', size);
  el.setAttribute('viewBox', '0 0 16 16'); el.setAttribute('aria-hidden', 'true');
  el.innerHTML = markup; // markup estático deste arquivo, nunca dado externo
  return el;

    case 'metro': return [A(state.metro.running ? 'stop-metro' : 'start-metro', state.metro.running ? 'Parar Metro' : 'Subir Metro', ['↵']), A('toggle-theme', 'Alternar tema', ['MOD', 'J'], true)];
    case 'logcat': return [A('open-app', 'Abrir o app', ['↵']), A('clear-logcat', 'Limpar tela', ['MOD', 'L']), A('toggle-theme', 'Alternar tema', ['MOD', 'J'], true)];
  }

}

function runAction(id, item) {
  if (id === 'toggle-theme') return setTheme(ui.theme === 'dark' ? 'light' : 'dark');
  if (item && item.kind === 'report') {
    const reps = state.reports || [];
    const r = reps[ui.reportIndex] || reps[0];
    if (id === 'copy-md') return copy(r.markdown, 'Markdown copiado');
    if (id === 'toggle-source') { ui.reportView = ui.reportView === 'source' ? 'rendered' : 'source'; return render(); }
    if (id === 'prev-report') { ui.reportIndex = Math.min(reps.length - 1, ui.reportIndex + 1); return render(); }
    if (id === 'next-report') { ui.reportIndex = Math.max(0, ui.reportIndex - 1); return render(); }
    // O Spalla não fala com agentes: ele copia o pedido pra você colar no terminal do Atlas.
    if (id === 'copy-ask') return copy(REPORT_REQUEST, 'Pedido copiado. Cole no terminal do Atlas.');
  }
  if (id === 'mute' && item && item.kind === 'agent') {
    ui.muted.has(item.ref.id) ? ui.muted.delete(item.ref.id) : ui.muted.add(item.ref.id);
    writePref('spalla.muted', [...ui.muted]);
    showToast('ok', ui.muted.has(item.ref.id) ? `${item.ref.name} silenciado` : `Avisos de ${item.ref.name} reativados`);
    return render();
  }
  if (id === 'mark-idle' && item && item.kind === 'agent') {
    item.ref.state = 'idle'; item.ref.lastEventAt = Date.now();
    showToast('ok', `${item.ref.name} marcado como idle`);
  }
  if (id === 'copy-task' && state.build) copy(state.build.task, 'Task copiada');
  if (id === 'copy-name' && item) copy(item.ref.name, 'Nome copiado');
  if (id === 'clear-logcat') state.logcat.lines = [];
  Spalla.onAction(id, item);
  render();
}
function copy(text, msg) {
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .then(() => showToast('ok', msg), () => showToast('fail', 'Não deu pra copiar'));
}
function showToast(kind, text, ms = 3000) { ui.toast = { kind, text, until: Date.now() + ms }; render(); }

  if (cur.kind === 'metro') {

    if (!m.running || !m.lines.length) return put(d, emptyState(m.running ? 'Metro sem saída ainda' : 'Metro parado',

    : h('span.state', null, h('span.dot', { style: `background: var(${b && b.status === 'running' ? '--run' : b && b.status === 'failed' ? '--fail' : '--text-4'})` }), summary);

function openActionPanel(cur) {
  ui.actionPanel = { item: cur, items: actionsFor(cur), index: 0, filter: '' };
  render();
  const input = document.querySelector('.ap-filter input'); if (input) input.focus();
}
function closeActionPanel() { ui.actionPanel = null; render(); }

function renderActionPanel() {
  const root = $('ap-root');
  const ap = ui.actionPanel;
  if (!ap) { root.replaceChildren(); return; }
  const filtered = ap.items.filter(a => matches(ap.filter, a.label));
  ap.index = Math.min(ap.index, Math.max(0, filtered.length - 1));
  const list = h('div.ap-list', { role: 'listbox', 'aria-label': 'Ações' });
  filtered.forEach((a, i) => {
    if (a.sep && i > 0) list.append(h('div.ap-sep', { role: 'presentation' }));
    list.append(h('button.ap-item', { type: 'button', role: 'option', 'aria-selected': String(i === ap.index),
      onclick: () => { closeActionPanel(); runAction(a.id, ap.item); } }, h('span.label', null, a.label), keys(...a.keys)));
  });
  if (!filtered.length) list.append(h('div.list-empty', null, 'Nenhuma ação com esse nome.'));
  const prevInput = document.querySelector('.ap-filter input');
  const hadFocus = prevInput && document.activeElement === prevInput;
  const input = h('input', { type: 'text', placeholder: 'Buscar ações…', value: ap.filter, 'aria-label': 'Buscar ações',
    oninput: e => { ap.filter = e.target.value; ap.index = 0; renderActionPanel(); } });
  root.replaceChildren(
    h('div.ap-backdrop', { onclick: closeActionPanel }),
    h('div.ap', { role: 'dialog', 'aria-label': 'Ações' },
      h('div.ap-title', null, ap.item ? `${ap.item.name} · ${ap.item.sub}` : 'Ações'),
      list,
      h('div.ap-filter', null, input)));

function setTheme(t) {
  ui.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  writePref('spalla.theme', t);
  render();

function pendingCount() { return state.agents.filter(a => a.state === 'needs_approval' || a.state === 'waiting_input').length; }

function render() {
  document.documentElement.setAttribute('data-theme', ui.theme);
  const items = buildItems();
  const cur = currentItem(items);
  if (cur) ui.selected = cur.id;
  renderTopbar();
  renderList(items, cur);
  const pane = $('detail'), paneTop = pane.scrollTop, sameDetail = ui.lastDetail === ui.selected;
  const lb = document.querySelector('.log-body');
  const prev = lb ? { id: ui.lastDetail, top: lb.scrollTop, bottom: lb.scrollHeight - lb.scrollTop - lb.clientHeight < 48 } : null;
  renderDetail(cur);
  const nb = document.querySelector('.log-body');
  if (nb) nb.scrollTop = (!prev || prev.id !== ui.selected || prev.bottom) ? nb.scrollHeight : prev.top;

/* ═══════════════════════════════════════════════════════════════════
   Teclado
   /            focar busca
   ↑ ↓          mover seleção
   ↵            ação principal
   Ctrl/⌘ K     painel de ações
   Ctrl/⌘ J     alternar tema
   Esc          fechar painel / sair da busca
   ═══════════════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  const mod = IS_MAC ? e.metaKey : e.ctrlKey;
  const inInput = e.target.matches && e.target.matches('input, textarea');
  const ap = ui.actionPanel;

  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); ap ? closeActionPanel() : openActionPanel(currentItem(buildItems())); return; }
  if (mod && e.key.toLowerCase() === 'j') { e.preventDefault(); setTheme(ui.theme === 'dark' ? 'light' : 'dark'); return; }

  if (ap) {
    const filtered = ap.items.filter(a => matches(ap.filter, a.label));
    if (e.key === 'Escape') { e.preventDefault(); closeActionPanel(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); ap.index = Math.min(filtered.length - 1, ap.index + 1); renderActionPanel(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); ap.index = Math.max(0, ap.index - 1); renderActionPanel(); return; }
    if (e.key === 'Enter' && filtered[ap.index]) { e.preventDefault(); const a = filtered[ap.index]; const it = ap.item; closeActionPanel(); runAction(a.id, it); return; }
    return;
  }

  if (e.key === '/' && !inInput) { e.preventDefault(); $('search').focus(); return; }
  if ((e.key === '[' || e.key === ']') && !inInput && ui.selected === 'report') {
    e.preventDefault();
    runAction(e.key === '[' ? 'prev-report' : 'next-report', currentItem(buildItems()));
    return;
  }
  if (e.key === 'Escape' && inInput) { e.target.blur(); return; }

  const items = selectable(buildItems());
  const idx = items.findIndex(i => i.id === ui.selected);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (inInput && e.target.id !== 'search') return;
    e.preventDefault();
    const next = items[Math.max(0, Math.min(items.length - 1, idx + (e.key === 'ArrowDown' ? 1 : -1)))];
    if (next) { ui.selected = next.id; render(); }
    return;
  }
  if (e.key === 'Enter' && (!inInput || e.target.id === 'search')) {
    const cur = items[idx]; const a = actionsFor(cur)[0];
    if (a) { e.preventDefault(); runAction(a.id, cur); }
    return;
  }
  if (mod && !inInput) {
    const cur = items[idx];
    const hit = actionsFor(cur).find(a => a.keys[0] === 'MOD' && a.keys[a.keys.length - 1].toLowerCase() === e.key.toLowerCase() && (a.keys.includes('⇧') === e.shiftKey));
    if (hit) { e.preventDefault(); runAction(hit.id, cur); }
  }
});

$('search').addEventListener('input', e => { ui.query = e.target.value.trim(); render(); });
$('theme-btn').addEventListener('click', () => setTheme(ui.theme === 'dark' ? 'light' : 'dark'));

/* Relógios ao vivo + expiração do toast, sem re-render completo. */
setInterval(() => {
  document.querySelectorAll('[data-live-clock]').forEach(el => { el.textContent = fmtDur((Date.now() - Number(el.dataset.liveClock)) / 1000); });
  if (ui.toast && ui.toast.until <= Date.now()) { ui.toast = null; renderFooter(currentItem(buildItems())); }
}, 1000);
/* Re-render leve a cada 30s pra atualizar "há X min" e detectar agentes travados. */
setInterval(render, 30000);

/* ═══════════════════════════════════════════════════════════════════
   API pública
   >>> INTEGRAÇÃO <<<
   ═══════════════════════════════════════════════════════════════════ */
let renderTimer = null;
/** Re-render em lote: o SSE pode mandar dezenas de eventos por segundo. */
function scheduleRender() {
  if (renderTimer) return;
  renderTimer = setTimeout(() => { renderTimer = null; render(); }, 200);
}
const STORE_CAP = 20000;
function pushLines(arr, lines) { for (const l of lines) arr.push(l); if (arr.length > STORE_CAP) arr.splice(0, arr.length - STORE_CAP); }

/* Ações: operam o ambiente (build, Metro, app, emulador). Nenhuma aprova comando de agente. */
function post(path, body) {
  return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Spalla': '1' }, body: JSON.stringify(body || {}) })
    .then(r => r.json().catch(() => ({})).then(j => ({ ok: r.ok, ...j })), () => ({ ok: false, error: 'Sem conexão com o servidor do Spalla.' }));
}
function act(path, body, quiet) {
  return post(path, body).then(r => { if (!r.ok) showToast('fail', r.error || 'Não deu certo.'); else if (!quiet) showToast('ok', r.message || 'Feito.'); });
}
function logOf(item) { return item && (item.kind === 'build' ? state.build.log : item.ref && item.ref.log); }
function openLog(file) {
  if (!file) return showToast('fail', 'Este item não tem log.');
  if (state.build.log === file && state.build.status !== 'idle') ui.selected = 'build:current';
  else {
    const hx = state.history.find(x => x.log === file);
    if (!hx) return showToast('fail', 'Esse log não está no histórico recente.');
    ui.selected = 'hist:' + hx.id;
  }
  render();
  requestAnimationFrame(() => { const el = document.querySelector('.log'); if (el) el.scrollIntoView({ block: 'nearest' }); });
}
function copyFirstError(file) {
  if (!file) return showToast('fail', 'Este build não tem log.');
  fetchLog(file).then(lines => {
    const l = lines.find(x => RE_ERROR.test(x));
    l ? copy(l.trim(), 'Primeiro erro copiado') : showToast('ok', 'Nenhum erro neste log.');
  }, () => showToast('fail', 'Não consegui ler o log.'));
}

const Spalla = window.Spalla = {
  /** Substitui partes do estado e re-renderiza. Ex.: Spalla.update({ build: {...} }) */
  update(patch) { state = { ...state, ...patch }; scheduleRender(); },

  /** Insere/atualiza um agente (vindo de `spalla agent-event`). */
  upsertAgent(evt) {
    // evt: { agent, type, message, at }
    const at = evt.at || Date.now();
    let a = state.agents.find(x => x.id === evt.agent);
    const prevState = a && a.state;
    if (!a) { a = { id: evt.agent, name: evt.agent, events: [] }; state.agents.push(a); }
    a.state = evt.type; a.message = evt.message || ''; a.lastEventAt = at;
    a.events = [{ at, state: evt.type, message: evt.message || '' }, ...(a.events || [])].slice(0, 50);
    const m = /build-\d{8}-\d{6}\.log/.exec(a.message); a.log = m ? m[0] : a.log;
    if (prevState !== evt.type) notify(a);
    scheduleRender();
  },

  /** Novo resumo do agente gerenciador. report: { id, agent, at, file, markdown } */
  addReport(report) {
    const reps = state.reports || (state.reports = []);
    const i = reps.findIndex(r => r.id === report.id && r.agent === report.agent);
    if (i >= 0) reps[i] = report; else reps.unshift(report);
    reps.sort((a, b) => b.at - a.at);
    if (ui.reportIndex > 0 && i < 0) ui.reportIndex++;   // quem está lendo um antigo continua no mesmo
    if (!ui.muted.has(report.agent) && 'Notification' in window && Notification.permission === 'granted') {
      const p = reportProgress(report.markdown);
      try { new Notification(`Novo resumo do ${report.agent}`, { body: p.total ? `${p.done} de ${p.total} itens concluídos` : firstLine(report.markdown), tag: 'spalla-report' }); } catch {}
    }
    render();
  },

  /** Acrescenta linhas ao log do build atual. */
  appendBuildLines(lines) { pushLines(state.build.lines, lines); scheduleRender(); },

  /** Chamado em toda ação. Substitua para falar com o server.js. */
  onAction(id, item) {
    // copy-*, mute, clear-logcat, toggle-theme e as ações do resumo já foram tratados em runAction
    switch (id) {
      case 'open-log': return openLog(logOf(item));
      case 'copy-first-error': return copyFirstError(logOf(item));
      case 'stop-build': return act('/api/actions/stop-build');
      case 'rebuild': return act('/api/actions/rebuild', { variant: item && item.ref && item.ref.variant });
      case 'start-metro': case 'stop-metro': case 'open-app': case 'boot-avd': return act('/api/actions/' + id);
      case 'mark-idle': return act('/api/actions/mark-idle', { agent: item && item.ref && item.ref.id }, true);
    }
  }
};

/* Notificação + som só para o que precisa de você ou falhou, respeitando "silenciar". */
function notify(a) {
  if (ui.muted.has(a.id)) return;
  const important = a.state === 'needs_approval' || a.state === 'waiting_input' || a.state === 'failed';
  if (!important || !('Notification' in window) || Notification.permission !== 'granted') return;
  const title = a.state === 'failed' ? `${a.name} falhou` : `${a.name} está esperando você`;
  const body = a.state === 'needs_approval' ? `${a.message}\nAprove no terminal do agente.` : a.message;
  try { new Notification(title, { body, tag: 'spalla-' + a.id }); } catch {}
}

/* SSE (/stream) — eventos: init, patch, build-lines, metro-lines, logcat-lines, agent, report */
function notifyBuild(b) {
  if (b.status !== 'success' || !('Notification' in window) || Notification.permission !== 'granted') return;
  try { new Notification('Build concluído', { body: `${b.variant} · ${fmtDur(buildElapsed(b))}`, tag: 'spalla-build' }); } catch {}
}
function setConn(c) { if (state.connection !== c) Spalla.update({ connection: c }); }
function connect() {
  const es = new EventSource('/stream');
  es.onopen = () => setConn('connected');
  es.onerror = () => setConn(es.readyState === EventSource.CLOSED ? 'offline' : 'reconnecting');
  es.addEventListener('init', e => Spalla.update({ ...JSON.parse(e.data), connection: 'connected' }));
  es.addEventListener('patch', e => {
    const p = JSON.parse(e.data), prev = state.build.status;
    Spalla.update({
      build: { ...state.build, ...p.build },          // preserva as linhas
      history: p.history,
      device: { ...state.device, ...p.device },
      metro: { ...state.metro, ...p.metro }           // preserva as linhas
    });
    if (prev === 'running' && p.build.status !== 'running') notifyBuild(p.build);
  });
  es.addEventListener('build-lines', e => { const d = JSON.parse(e.data); if (d.reset) state.build.lines = []; Spalla.appendBuildLines(d.lines); });
  es.addEventListener('metro-lines', e => { const d = JSON.parse(e.data); if (d.reset) state.metro.lines = []; pushLines(state.metro.lines, d.lines); scheduleRender(); });
  es.addEventListener('logcat-lines', e => { const d = JSON.parse(e.data); if (d.reset) state.logcat.lines = []; pushLines(state.logcat.lines, d.lines); scheduleRender(); });
  es.addEventListener('agent', e => Spalla.upsertAgent(JSON.parse(e.data)));
  es.addEventListener('report', e => Spalla.addReport(JSON.parse(e.data)));
}
// primeira pintura com o estado real; o evento 'init' do SSE (mesmo formato) ressincroniza em seguida
fetch('/api/state').then(r => r.json()).then(st => Spalla.update({ ...st, connection: state.connection })).catch(() => {});
connect();

/* ═══════════════════════════════════════════════════════════════════
   >>> INTEGRAÇÃO <<<  Resumo do Maestro
   Lado do servidor (sugestão):
   • O Atlas grava cada resumo em .spalla/reports/<agente>/AAAAMMDD-HHMM.md
     (.spalla/ já está no .git/info/exclude, então nada vaza pro repositório).
   • O server observa a pasta (fs.watch) e, a cada arquivo novo ou alterado,
     manda o evento SSE `report` com { id, agent, at, file, markdown }.
   • GET /api/state inclui `reports` (os 20 mais recentes, novo primeiro).
   ═══════════════════════════════════════════════════════════════════ */
const REPORT_REQUEST = [
  'Escreva um resumo da situação das demandas em markdown e salve em',
  '.spalla/reports/atlas/$(date +%Y%m%d-%H%M).md, seguindo este formato:',
  '# <projeto>: situação geral',
  '**Resumo:** duas frases sobre o estado geral.',
  '## Demandas  (tabela: Demanda | Agente | Status)',
  '## <uma seção por demanda ativa>  (checklist com - [ ] e - [x])',
  '## Bloqueios  (citação com >, só se houver)',
  '## Decisões que precisam de você  (lista numerada, só se houver)',
  '## Próximos passos'
].join('\n');

render();
})();
</script>
