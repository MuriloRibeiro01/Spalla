<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Spalla</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#262d38;--txt:#d6dde6;--dim:#7d8896;--ok:#3fb950;--err:#f85149;--warn:#d29922;--info:#58a6ff;--run:#a371f7}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 system-ui,Segoe UI,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:14px;margin:0;font-weight:600}
.chip{padding:2px 8px;border:1px solid var(--line);border-radius:3px;font-size:12px;color:var(--dim)}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.err{color:var(--err);border-color:var(--err)}.chip.run{color:var(--run);border-color:var(--run)}.chip.warn{color:var(--warn);border-color:var(--warn)}
.sp{flex:1}
button,select,input{background:#0b0f14;color:var(--txt);border:1px solid var(--line);border-radius:3px;padding:3px 8px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--info)}
nav{display:flex;gap:2px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--dim)}
nav button.on{color:var(--txt);border-bottom-color:var(--info)}
nav .badge{margin-left:6px;background:var(--err);color:#fff;border-radius:8px;padding:0 6px;font-size:11px}
main{flex:1;min-height:0;position:relative}
section{position:absolute;inset:0;display:none;flex-direction:column;padding:10px 14px;gap:8px}
section.on{display:flex}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.progress{height:14px;background:#0b0f14;border:1px solid var(--line);border-radius:3px;overflow:hidden;flex:1;min-width:200px}
.progress>i{display:block;height:100%;background:var(--info);width:0;transition:width .3s}
.progress.ok>i{background:var(--ok)}.progress.err>i{background:var(--err)}
.log{flex:1;min-height:0;overflow:auto;background:#0b0f14;border:1px solid var(--line);border-radius:3px;padding:6px 8px;font:12px/1.4 Consolas,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
.log div{padding:0 2px}
.log .hide{display:none}
.log .e,.log .L-E{color:var(--err)}.log .L-W{color:var(--warn)}.log .L-I{color:#6cc08b}.log .L-D{color:var(--info)}.log .L-V{color:var(--dim)}
.log .wrong{background:#3a1519;color:#ffb3ae}
.log .crash{background:#4a1418;color:#ffd0cc;font-weight:600}
.log .t{color:var(--dim)}
.log mark{background:#5a4a00;color:#fff}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:3px;max-width:560px}
.kv b{color:var(--dim);font-weight:400}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:5px 10px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:400}
tr.click{cursor:pointer}tr.click:hover{background:var(--panel)}
.ok{color:var(--ok)}.err{color:var(--err)}.dim{color:var(--dim)}.run{color:var(--run)}.warn{color:var(--warn)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--dim);border-radius:3px;padding:8px 10px;cursor:pointer}
.card h3{margin:0 0 4px;font-size:13px;display:flex;justify-content:space-between}
.card .act{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.working,.card.tool{border-left-color:var(--info)}
.card.needs_approval{border-left-color:var(--err)}.card.waiting_input{border-left-color:var(--warn)}
.card.failed{border-left-color:var(--err)}.card.done{border-left-color:var(--ok)}.card.idle{border-left-color:var(--dim)}
.card.stuck{border-left-color:var(--warn);border-style:dashed}
.card.blink{animation:bl 1s steps(2,start) infinite}
@keyframes bl{50%{background:#3a1519}}
.feed{flex:1;min-height:0;overflow:auto;background:#0b0f14;border:1px solid var(--line);border-radius:3px;font:12px/1.5 Consolas,Menlo,monospace}
.feed div{padding:1px 8px;border-bottom:1px solid #12171e}
.mutes label{margin-right:12px;color:var(--dim)}
.empty{color:var(--dim);padding:12px}
</style>
</head>
<body>
<header>
  <h1>Spalla <span class="dim" id="proj"></span></h1>
  <span class="chip" id="cEmu">emulador: —</span>
  <span class="chip" id="cBuild">build: —</span>
  <span class="chip" id="cConn">desconectado</span>
  <span class="sp"></span>
  <button id="btnNotif">Ativar notificações</button>
</header>
<nav id="nav"></nav>
<main>
  <section id="p-build">
    <div class="bar">
      <span class="chip" id="bBadge">—</span>
      <div class="progress" id="bProg"><i></i></div>
      <span id="bCount" class="dim"></span>
      <span class="dim" id="bTime"></span>
    </div>
    <div class="bar"><span class="dim">task:</span><span id="bTask" class="dim">—</span></div>
    <div class="bar">
      <input id="bSearch" placeholder="buscar no log" size="28">
      <label class="dim"><input type="checkbox" id="bOnlyErr"> só erros</label>
      <label class="dim"><input type="checkbox" id="bScroll" checked> auto-scroll</label>
      <span class="dim" id="bFile"></span>
    </div>
    <div class="log" id="bLog"></div>
  </section>

  <section id="p-logcat">
    <div class="bar">
      <select id="lLevel"><option>V</option><option>D</option><option>I</option><option>W</option><option>E</option></select>
      <input id="lFilter" placeholder="filtrar por tag/texto" size="28">
      <button id="lPause">Pausar</button>
      <button id="lClear">Limpar tela</button>
      <label class="dim"><input type="checkbox" id="lScroll" checked> auto-scroll</label>
      <span class="dim" id="lInfo"></span>
    </div>
    <div class="log" id="lLog"></div>
  </section>

  <section id="p-metro">
    <div class="bar">
      <input id="mFilter" placeholder="filtrar" size="28">
      <label class="dim"><input type="checkbox" id="mOnlyErr"> só erros de JS</label>
      <label class="dim"><input type="checkbox" id="mScroll" checked> auto-scroll</label>
      <span class="chip" id="mChip">metro: —</span>
    </div>
    <div class="log" id="mLog"></div>
  </section>

  <section id="p-emu">
    <div class="kv" id="emuKv"></div>
  </section>

  <section id="p-hist">
    <div style="overflow:auto"><table id="hTable"><thead><tr><th>Início</th><th>Variant</th><th>Duração</th><th>Resultado</th><th>Log</th></tr></thead><tbody></tbody></table></div>
    <div class="bar"><span class="dim" id="hName"></span></div>
    <div class="log" id="hLog" style="display:none"></div>
  </section>

  <section id="p-agents">
    <div class="cards" id="cards"></div>
    <div class="bar mutes" id="mutes"></div>
    <div class="bar">
      <select id="aAgent"><option value="">todos os agentes</option></select>
      <select id="aType"><option value="">todos os tipos</option><option>working</option><option>tool</option><option>needs_approval</option><option>waiting_input</option><option>done</option><option>failed</option><option>idle</option></select>
      <span class="dim">O dashboard só avisa. Aprovações e respostas continuam no terminal de cada agente.</span>
    </div>
    <div class="feed" id="feed"></div>
  </section>
</main>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const TABS = [['build','Build'],['logcat','Logcat'],['metro','Metro'],['emu','Emulador'],['hist','Histórico'],['agents','Agentes']];
const S = { cfg:{}, status:{}, progress:{total:0,done:0}, current:null, emu:{}, history:[], agents:[], init:false };
const MAXDOM = 5000;
let tab = localStorage.getItem('dd.tab') || 'build';

// ---------------------------------------------------------------- util
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmtDur = (ms) => { if (ms == null) return '—'; const s = Math.round(ms/1000); return s >= 60 ? Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s' : s+'s'; };
const fmtTime = (t) => new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const ago = (t) => fmtDur(Math.max(0, Date.now() - new Date(t).getTime()));

// ---------------------------------------------------------------- abas
const nav = $('#nav');
for (const [id, label] of TABS) {
  const b = document.createElement('button');
  b.dataset.tab = id; b.innerHTML = label + (id === 'agents' ? '<span class="badge" id="agBadge" style="display:none"></span>' : '');
  b.onclick = () => setTab(id);
  nav.appendChild(b);
}
function setTab(id) {
  tab = id; localStorage.setItem('dd.tab', id);
  for (const b of nav.children) b.classList.toggle('on', b.dataset.tab === id);
  for (const [t] of TABS) $('#p-' + t).classList.toggle('on', t === id);
  const log = { build:'#bLog', logcat:'#lLog', metro:'#mLog' }[id];
  if (log) autoscroll(log);
}
function autoscroll(sel) {
  const on = { '#bLog':'#bScroll', '#lLog':'#lScroll', '#mLog':'#mScroll' }[sel];
  if ($(on).checked) $(sel).scrollTop = $(sel).scrollHeight;
}

// ---------------------------------------------------------------- notificações / som
const muted = JSON.parse(localStorage.getItem('dd.muted') || '{}');
const saveMuted = () => localStorage.setItem('dd.muted', JSON.stringify(muted));
let audio;
function beep(freq = 880) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.12, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.35);
    o.start(); o.stop(audio.currentTime + 0.35);
  } catch (_) {}
}
function notify(kind, agent, title, body) {
  if (muted['t:' + kind] || (agent && muted['a:' + agent])) return;
  beep(kind === 'failed' ? 440 : 880);
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification(title, { body, tag: kind + (agent || '') }); } catch (_) {}
  }
}
$('#btnNotif').onclick = async () => {
  if (!('Notification' in window)) return;
  const p = await Notification.requestPermission();
  beep(660);
  refreshNotifBtn(p);
};
function refreshNotifBtn(p) {
  const b = $('#btnNotif');
  p = p || (('Notification' in window) ? Notification.permission : 'denied');
  b.textContent = p === 'granted' ? 'Notificações ativas' : p === 'denied' ? 'Notificações bloqueadas' : 'Ativar notificações';
}
refreshNotifBtn();

// ---------------------------------------------------------------- logs genéricos
function lineWrap(sel) { return $(sel); }
function trimDom(el) { while (el.childElementCount > MAXDOM) el.removeChild(el.firstChild); }

// ---------- Build
const B = { wrong: false, q: '', onlyErr: false };
const ERR_RE = /^e: |error:|\bFAILURE\b|What went wrong|^\* |Execution failed|BUILD FAILED|\bFAILED\b/i;
function buildClass(l) {
  if (/^\* What went wrong:/.test(l)) { B.wrong = true; return 'wrong'; }
  if (/^\* Try:|^\* Exception is:|^BUILD /.test(l)) B.wrong = false;
  if (B.wrong) return 'wrong';
  if (/^e: |error:|\bFAILURE\b|BUILD FAILED/i.test(l) || /^> Task .* FAILED/.test(l)) return 'e';
  return '';
}
function addBuild(lines) {
  const el = $('#bLog'), frag = document.createDocumentFragment();
  for (const l of lines) {
    const d = document.createElement('div'); d.textContent = l;
    const c = buildClass(l); if (c) d.className = c;
    d._raw = l; d._err = !!c;
    applyBuildFilter(d); frag.appendChild(d);
  }
  el.appendChild(frag); trimDom(el); autoscroll('#bLog');
}
function applyBuildFilter(d) {
  const q = B.q.toLowerCase();
  let hide = (B.onlyErr && !d._err) || (q && !d._raw.toLowerCase().includes(q));
  d.classList.toggle('hide', !!hide);
}
function refilterBuild() { for (const d of $('#bLog').children) applyBuildFilter(d); }
$('#bSearch').oninput = (e) => { B.q = e.target.value; refilterBuild(); };
$('#bOnlyErr').onchange = (e) => { B.onlyErr = e.target.checked; refilterBuild(); };
function resetBuild() { $('#bLog').innerHTML = ''; B.wrong = false; }

function renderBuild() {
  const st = S.status, p = S.progress;
  const result = st.result || (st.phase === 'building' ? 'running' : null);
  const chip = $('#bBadge'), prog = $('#bProg');
  const label = result === 'SUCCESS' ? 'SUCCESS' : result === 'FAILED' ? 'FAILED' : result === 'running' ? 'RUNNING' : 'SEM BUILD';
  chip.textContent = label;
  chip.className = 'chip ' + (result === 'SUCCESS' ? 'ok' : result === 'FAILED' ? 'err' : result === 'running' ? 'run' : '');
  const total = Math.max(p.total, p.done, 1);
  let pct = p.total ? Math.min(100, (p.done / total) * 100) : 0;
  if (result === 'running' && pct > 99) pct = 99;
  if (result === 'SUCCESS') pct = 100;
  prog.firstElementChild.style.width = pct + '%';
  prog.className = 'progress ' + (result === 'SUCCESS' ? 'ok' : result === 'FAILED' ? 'err' : '');
  $('#bCount').textContent = p.total ? `${p.done}/${p.total} tasks (${p.executed} exec · ${p.upToDate} up-to-date · ${p.fromCache} cache)` : (result === 'running' ? 'calculando grafo…' : '');
  $('#bTask').textContent = result === 'running' ? (S.current || '—') : (p.failedTasks.length ? 'falhou: ' + p.failedTasks.join(', ') : '—');
  $('#bFile').textContent = st.logFile || '';
  const c = $('#cBuild');
  c.textContent = 'build: ' + (result === 'running' ? `${Math.round(pct)}%` : result || '—');
  c.className = 'chip ' + (result === 'SUCCESS' ? 'ok' : result === 'FAILED' ? 'err' : result === 'running' ? 'run' : '');
  tickBuildTime();
}
function tickBuildTime() {
  const st = S.status; if (!st.startedAt) { $('#bTime').textContent = ''; return; }
  const end = st.finishedAt || Date.now();
  $('#bTime').textContent = fmtDur(end - st.startedAt);
}
setInterval(tickBuildTime, 1000);

// ---------- Logcat
const LV = { V:0, D:1, I:2, W:3, E:4, F:4, A:4 };
const L = { paused:false, buf:[], crash:0, q:'', min:0 };
const TT = /^(\d\d-\d\d \d\d:\d\d:\d\d\.\d+)\s+(\d+)\s+(\d+)\s+([VDIWEFA])\s+(.*?):\s?(.*)$/;
function logcatEl(l) {
  const m = TT.exec(l), d = document.createElement('div');
  let lvl = 'I';
  if (m) {
    lvl = m[4]; d._tag = m[5];
    d.innerHTML = `<span class="t">${m[1]} ${m[2]}</span> ${lvl} <b>${esc(m[5])}</b>: ${esc(m[6])}`;
  } else d.textContent = l;
  d._raw = l; d._lv = LV[lvl] ?? 2;
  if (/FATAL EXCEPTION/.test(l)) { L.crash = 25; d.className = 'crash'; }
  else if (L.crash > 0 && d._lv >= 4) { L.crash--; d.className = 'crash'; }
  else d.className = 'L-' + (lvl === 'F' || lvl === 'A' ? 'E' : lvl);
  d.classList.toggle('hide', !logcatVisible(d));
  return d;
}
function logcatVisible(d) {
  if (d.classList.contains('crash')) return true;
  if (d._lv < L.min) return false;
  return !L.q || d._raw.toLowerCase().includes(L.q);
}
function addLogcat(lines) {
  if (L.paused) { L.buf.push(...lines); $('#lInfo').textContent = L.buf.length + ' linhas em espera'; return; }
  const el = $('#lLog'), frag = document.createDocumentFragment();
  for (const l of lines) frag.appendChild(logcatEl(l));
  el.appendChild(frag); trimDom(el); autoscroll('#lLog');
}
function refilterLogcat() { for (const d of $('#lLog').children) d.classList.toggle('hide', !logcatVisible(d)); }
$('#lLevel').onchange = (e) => { L.min = LV[e.target.value]; refilterLogcat(); };
$('#lFilter').oninput = (e) => { L.q = e.target.value.toLowerCase(); refilterLogcat(); };
$('#lPause').onclick = () => {
  L.paused = !L.paused; $('#lPause').textContent = L.paused ? 'Retomar' : 'Pausar';
  if (!L.paused) { const b = L.buf; L.buf = []; $('#lInfo').textContent = ''; addLogcat(b); }
};
$('#lClear').onclick = () => { $('#lLog').innerHTML = ''; };

// ---------- Metro
const M = { q:'', onlyErr:false };
const JSERR = /error|unable to resolve|syntaxerror|transformerror|invariant violation|red ?box|bundling failed|\bwarn\b.*require cycle|✖/i;
function addMetro(lines) {
  const el = $('#mLog'), frag = document.createDocumentFragment();
  for (const l of lines) {
    const d = document.createElement('div'); d.textContent = l; d._raw = l;
    if (JSERR.test(l)) { d.className = 'e'; d._err = true; }
    applyMetroFilter(d); frag.appendChild(d);
  }
  el.appendChild(frag); trimDom(el); autoscroll('#mLog');
}
function applyMetroFilter(d) {
  const q = M.q.toLowerCase();
  d.classList.toggle('hide', (M.onlyErr && !d._err) || (q && !d._raw.toLowerCase().includes(q)));
}
$('#mFilter').oninput = (e) => { M.q = e.target.value; for (const d of $('#mLog').children) applyMetroFilter(d); };
$('#mOnlyErr').onchange = (e) => { M.onlyErr = e.target.checked; for (const d of $('#mLog').children) applyMetroFilter(d); };

// ---------- Emulador
function renderEmu() {
  const e = S.emu, c = $('#cEmu');
  const state = !e.adb ? 'adb indisponível' : !e.online ? 'sem device' : !e.boot ? 'iniciando…' : 'pronto';
  c.textContent = 'emulador: ' + state;
  c.className = 'chip ' + (state === 'pronto' ? 'ok' : e.online ? 'warn' : 'err');
  const yn = (v) => v ? '<span class="ok">sim</span>' : '<span class="dim">não</span>';
  $('#emuKv').innerHTML =
    `<b>adb</b><span>${yn(e.adb)}</span><b>device</b><span>${e.serial ? esc(e.serial) : '<span class="dim">nenhum</span>'}</span>` +
    `<b>boot completo</b><span>${yn(e.boot)}</span><b>app instalado</b><span>${yn(e.installed)} <span class="dim">${esc(S.cfg.package || '')}</span></span>` +
    `<b>app rodando</b><span>${e.pid ? '<span class="ok">sim</span> <span class="dim">pid ' + e.pid + '</span>' : '<span class="dim">não</span>'}</span>` +
    `<b>fase do wrapper</b><span>${esc(S.status.phase || '—')}</span>`;
}

// ---------- Histórico
function renderHist() {
  const tb = $('#hTable tbody'); tb.innerHTML = '';
  if (!S.history.length) { tb.innerHTML = '<tr><td colspan="5" class="empty">nenhum build registrado</td></tr>'; return; }
  for (const h of S.history) {
    const tr = document.createElement('tr'); tr.className = 'click';
    tr.innerHTML = `<td>${fmtTime(h.startedAt)}</td><td>${esc(h.variant || '')}</td><td>${fmtDur(h.durationMs)}</td><td class="${h.result === 'SUCCESS' ? 'ok' : 'err'}">${esc(h.result || '')}</td><td class="dim">${esc(h.logFile || '')}</td>`;
    tr.onclick = () => openHistLog(h);
    tb.appendChild(tr);
  }
}
async function openHistLog(h) {
  if (!h.logFile) return;
  const el = $('#hLog'); el.style.display = 'block'; $('#hName').textContent = h.logFile;
  const r = await fetch('/api/log?f=' + encodeURIComponent(h.logFile));
  const txt = await r.text(); el.innerHTML = '';
  let wrong = false; const frag = document.createDocumentFragment();
  for (const l of txt.split('\n')) {
    const d = document.createElement('div'); d.textContent = l;
    if (/^\* What went wrong:/.test(l)) wrong = true; else if (/^\* Try:|^BUILD /.test(l)) wrong = false;
    if (wrong) d.className = 'wrong'; else if (/^e: |error:|BUILD FAILED/i.test(l)) d.className = 'e';
    frag.appendChild(d);
  }
  el.appendChild(frag); el.scrollTop = el.scrollHeight;
}

// ---------- Agentes
const PEND = new Set(['needs_approval', 'waiting_input', 'failed']);
const ICON = { working:'▶', tool:'⚙', needs_approval:'■', waiting_input:'?', done:'✓', failed:'✕', idle:'·' };
const acked = JSON.parse(localStorage.getItem('dd.acked') || '{}');
const A = { agents: new Map(), events: [] };
function grp(t) { return t === 'tool' ? 'working' : t; }
function ingestAgent(ev, live) {
  A.events.push(ev); if (A.events.length > 1500) A.events.shift();
  let a = A.agents.get(ev.agent);
  if (!a) { a = { name: ev.agent, evs: [] }; A.agents.set(ev.agent, a); updateAgentSelect(); }
  const prev = a.last;
  a.last = ev; a.project = ev.project || a.project;
  if (!prev || grp(prev.type) !== grp(ev.type)) a.since = ev.ts;
  if (ev.type === 'tool' || ev.tool) a.lastTool = ev;
  if (live) {
    const label = { needs_approval:'precisa de aprovação', waiting_input:'aguardando você', failed:'falhou' }[ev.type];
    if (label) notify(ev.type, ev.agent, `${ev.agent} ${label}`, ev.message || ev.command || '');
  }
}
function updateAgentSelect() {
  const sel = $('#aAgent'), cur = sel.value;
  sel.innerHTML = '<option value="">todos os agentes</option>' + [...A.agents.keys()].sort().map((n) => `<option>${esc(n)}</option>`).join('');
  sel.value = cur;
  renderMutes();
}
function renderMutes() {
  const types = ['needs_approval', 'waiting_input', 'failed', 'build'];
  $('#mutes').innerHTML = '<span class="dim">Silenciar:</span> ' +
    types.map((t) => `<label><input type="checkbox" data-m="t:${t}" ${muted['t:' + t] ? 'checked' : ''}> ${t}</label>`).join('') +
    [...A.agents.keys()].sort().map((n) => `<label><input type="checkbox" data-m="a:${esc(n)}" ${muted['a:' + n] ? 'checked' : ''}> ${esc(n)}</label>`).join('');
  for (const i of $('#mutes').querySelectorAll('input')) i.onchange = () => { muted[i.dataset.m] = i.checked; saveMuted(); };
}
function agentState(a) {
  const stuckMs = (S.cfg.stuckMinutes || 5) * 60000;
  const idle = Date.now() - new Date(a.last.ts).getTime();
  const stuck = (a.last.type === 'working' || a.last.type === 'tool') && idle > stuckMs;
  const pend = PEND.has(a.last.type) && acked[a.name] !== a.last.ts;
  return { stuck, pend };
}
function renderAgents() {
  const list = [...A.agents.values()].map((a) => ({ a, s: agentState(a) }));
  list.sort((x, y) => (y.s.pend - x.s.pend) || (new Date(y.a.last.ts) - new Date(x.a.last.ts)));
  const cards = $('#cards');
  cards.innerHTML = list.length ? '' : '<div class="empty">Nenhum evento de agente ainda. Os hooks gravam em .devdash/agents/events.jsonl.</div>';
  for (const { a, s } of list) {
    const t = a.last.type, d = document.createElement('div');
    d.className = `card ${t}${s.stuck ? ' stuck' : ''}${s.pend ? ' blink' : ''}`;
    const act = a.lastTool ? `${a.lastTool.tool || ''} ${a.lastTool.command || ''}`.trim() : (a.last.message || '');
    d.innerHTML = `<h3><span>${ICON[t] || '·'} ${esc(a.name)}</span><span class="dim">${esc(t)}${s.stuck ? ' · possivelmente travado' : ''}</span></h3>` +
      `<div class="act" title="${esc(act)}">${esc(act) || '—'}</div>` +
      `<div class="dim">há ${ago(a.since)} · ${esc(a.project || '')}${a.last.cwd && a.last.cwd !== '.' ? ' · ' + esc(a.last.cwd) : ''}</div>`;
    d.onclick = () => { acked[a.name] = a.last.ts; localStorage.setItem('dd.acked', JSON.stringify(acked)); renderAgents(); };
    cards.appendChild(d);
  }
  const pend = list.filter((x) => x.s.pend).length;
  document.title = (pend ? `(${pend}) ` : '') + 'Spalla';
  const bd = $('#agBadge'); bd.style.display = pend ? '' : 'none'; bd.textContent = pend;
  renderFeed();
}
function renderFeed() {
  const fa = $('#aAgent').value, ft = $('#aType').value, el = $('#feed');
  const evs = A.events.filter((e) => (!fa || e.agent === fa) && (!ft || e.type === ft)).slice(-400).reverse();
  el.innerHTML = '';
  for (const e of evs) {
    const d = document.createElement('div');
    const cls = e.type === 'failed' || e.type === 'needs_approval' ? 'err' : e.type === 'waiting_input' ? 'warn' : e.type === 'done' ? 'ok' : '';
    d.innerHTML = `<span class="dim">${new Date(e.ts).toLocaleTimeString('pt-BR')}</span> <b>${esc(e.agent)}</b> <span class="${cls}">${esc(e.type)}</span> ${esc([e.tool, e.command, e.message].filter(Boolean).join(' · '))}`;
    el.appendChild(d);
  }
}
$('#aAgent').onchange = renderFeed; $('#aType').onchange = renderFeed;
setInterval(renderAgents, 5000);

// ---------------------------------------------------------------- SSE
let es;
function connect() {
  es = new EventSource('/stream');
  es.onopen = () => { $('#cConn').textContent = 'conectado'; $('#cConn').className = 'chip ok'; };
  es.onerror = () => { $('#cConn').textContent = 'reconectando…'; $('#cConn').className = 'chip warn'; };
  es.addEventListener('init', (m) => {
    const d = JSON.parse(m.data);
    S.cfg = d.config; S.status = d.status; S.progress = d.progress; S.current = d.current; S.emu = d.emu; S.history = d.history;
    $('#proj').textContent = '— ' + d.config.name;
    $('#mChip').textContent = 'metro: porta ' + d.config.metroPort;
    resetBuild(); addBuild(d.build);
    $('#lLog').innerHTML = ''; L.buf = []; addLogcat(d.logcat);
    $('#mLog').innerHTML = ''; addMetro(d.metro);
    A.agents.clear(); A.events = []; for (const e of d.agents) ingestAgent(e, false);
    S.init = true; renderBuild(); renderEmu(); renderHist(); renderAgents(); renderMutes(); setTab(tab);
  });
  es.addEventListener('status', (m) => {
    const old = S.status; S.status = JSON.parse(m.data);
    const was = old.result, now = S.status.result;
    if (S.init && was === 'running' && (now === 'SUCCESS' || now === 'FAILED')) {
      notify('build', null, 'Build ' + now, `${S.status.variant || ''} em ${fmtDur(S.status.durationMs)}`);
    }
    renderBuild(); renderEmu();
  });
  es.addEventListener('progress', (m) => { S.progress = JSON.parse(m.data); renderBuild(); });
  es.addEventListener('build', (m) => {
    const d = JSON.parse(m.data);
    if (d.reset) resetBuild();
    if (d.current !== undefined) S.current = d.current;
    addBuild(d.lines); renderBuild();
  });
  es.addEventListener('logcat', (m) => { const d = JSON.parse(m.data); if (d.reset) $('#lLog').innerHTML = ''; addLogcat(d.lines); });
  es.addEventListener('metro', (m) => { const d = JSON.parse(m.data); if (d.reset) $('#mLog').innerHTML = ''; addMetro(d.lines); });
  es.addEventListener('emu', (m) => { S.emu = JSON.parse(m.data); renderEmu(); });
  es.addEventListener('history', (m) => { S.history = JSON.parse(m.data); renderHist(); });
  es.addEventListener('agents', (m) => {
    const d = JSON.parse(m.data);
    for (const e of d.events) ingestAgent(e, S.init);
    renderAgents();
  });
}
setTab(tab);
connect();
</script>
